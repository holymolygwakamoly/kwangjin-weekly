<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>주간 동향</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D5FD1'/%3E%3Ctext x='32' y='30' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='19' fill='%23fff'%3E광진%3C/text%3E%3Ctext x='32' y='51' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='19' fill='%23fff'%3E영업%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-label="광진 영업"><span>광진</span><span>영업</span></div>
      <div>
        <div class="brand-name">주간 동향</div>
      </div>
    </div>
    <div id="wkBlock">
      <div class="label">주차 (업데이트 날짜)</div>
      <div class="week-ctrl">
        <button class="icon-btn" id="wkPrev" type="button" aria-label="이전 주">‹</button>
        <select id="wkSel" aria-label="주차 선택"></select>
        <button class="icon-btn" id="wkNext" type="button" aria-label="다음 주">›</button>
      </div>
      <div class="week-strip" id="wkStrip" aria-label="주차별 기사 수"></div>
      <div class="week-range mono" id="wkRange"></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="대시보드 탭" id="tabs"></nav>
    <div class="rail-foot">
      <div id="dbStatus"><span class="dot"></span>불러오는 중…</div>
      <div id="lastUpd"></div>
      <label><input type="checkbox" id="expandAll"> 상세 모두 펼치기</label>
      <div><span class="kbd">←</span> <span class="kbd">→</span> 주차 이동 · <span class="kbd">/</span> 검색</div>
    </div>
  </aside>
  <main>
    <header class="head">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="head-actions">
        <label class="gsearch"><span class="sr">전체 기간 검색</span><input id="gq" type="search" placeholder="전체 기간 검색 — 차종, 회사, 이슈…" autocomplete="off"></label>
        <button class="btn" type="button" data-act="print">인쇄 / PDF</button>
      </div>
    </header>
    <div id="subnav"></div>
    <div id="filters"></div>
    <div id="content"></div>
  </main>
</div>

<script src="ir.js"></script>
<script src="irsite.js"></script>
<script src="app.js"></script>
</body>
</html>
